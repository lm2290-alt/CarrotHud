name: Build Android APK




on: [push]




jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply OSM GPS HUD patch
        run: git apply 0001-Render-live-OSM-map-beside-Carrot-HUD.patch
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Verify stationary road motion
        run: |
          mkdir -p /tmp/carrot-motion-check
          javac -d /tmp/carrot-motion-check app/src/main/java/com/example/carrothud/RoadMotion.java tests/RoadMotionCheck.java
          java -cp /tmp/carrot-motion-check RoadMotionCheck
      - name: Inspect official Kakao navigation SDK
        run: |
          curl --fail --connect-timeout 15 --max-time 90 -o /tmp/knsdk-ui.aar https://devrepo.kakaomobility.com/repository/kakao-mobility-android-knsdk-public/com/kakaomobility/knsdk/knsdk_ui/1.12.7/knsdk_ui-1.12.7.aar
          unzip -p /tmp/knsdk-ui.aar classes.jar > /tmp/knsdk-ui.jar
          jar tf /tmp/knsdk-ui.jar | grep -E 'KNSDK|KNPOI|KNLanguageType|KNNaviView.class|KNGuidance.class|KNRoutePriority'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarrotHUD-APK
          path: app/build/outputs/apk/debug/app-debug.apk



